<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#555555"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.8"/>
  
  <!-- Abstract P2P Mesh / CPU Die -->
  <g stroke="#333333" stroke-width="1.5" fill="none" opacity="0.6">
    <polygon points="950,200 1050,100 1100,250 1000,350" />
    <polygon points="950,200 850,300 1000,350" />
    <polygon points="1050,100 1150,150 1100,250" />
    <circle cx="950" cy="200" r="4" fill="#ffffff" />
    <circle cx="1050" cy="100" r="3" fill="#777777" />
    <circle cx="1100" cy="250" r="3" fill="#777777" />
    <circle cx="850" cy="300" r="3" fill="#777777" />
    <circle cx="1000" cy="350" r="4" fill="#ffffff" />
    <circle cx="1150" cy="150" r="3" fill="#777777" />
    <line x1="950" y1="200" x2="1000" y2="350" stroke="#555555" stroke-dasharray="4 4"/>
    <line x1="1050" y1="100" x2="1100" y2="250" stroke="#555555" stroke-dasharray="2 2"/>
  </g>

  <!-- Typography -->
  <text x="80" y="220" font-family="monospace, sans-serif" font-size="110" font-weight="900" fill="url(#textGrad)" letter-spacing="8">AUTOGENESIS</text>
  <text x="85" y="260" font-family="monospace, sans-serif" font-size="18" fill="#666666" letter-spacing="6">SELF-EVOLVING P2P IN-MEMORY COMPILER</text>
  
  <!-- Bottom Data -->
  <text x="85" y="340" font-family="monospace, sans-serif" font-size="12" fill="#333333">x86_64 // NO LLVM // ZERO DEPENDENCIES // RAW OPCODES</text>
  <text x="85" y="360" font-family="monospace, sans-serif" font-size="12" fill="#333333">VANTACORE HQ © 2024</text>
</svg>
